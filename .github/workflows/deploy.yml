name: Validate PulsoTech for Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test application security and data recovery
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Build static site for Cloudflare Pages
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_REQUIRE_ADMIN_CAPTCHA: ${{ vars.NEXT_PUBLIC_REQUIRE_ADMIN_CAPTCHA }}
          NEXT_PUBLIC_STORE_RUC: ${{ vars.NEXT_PUBLIC_STORE_RUC }}
          NEXT_PUBLIC_STORE_MODE: ${{ vars.NEXT_PUBLIC_STORE_MODE }}
          NEXT_PUBLIC_STORE_URL: ${{ vars.NEXT_PUBLIC_STORE_URL }}
          NEXT_PUBLIC_COMPLAINT_BOOK_ENABLED: ${{ vars.NEXT_PUBLIC_COMPLAINT_BOOK_ENABLED }}
