name: Verify isolated Supabase operations

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/supabase-integration.yml"
      - "tests/integration/**"
      - "package.json"
      - "package-lock.json"
      - "supabase_schema.sql"
      - "supabase/activate-*.sql"
      - "src/lib/cart-stock.ts"
      - "src/lib/product-media.ts"
      - "src/lib/sales-validation.ts"
      - "src/lib/store-backup.ts"
      - "src/types/index.ts"

permissions:
  contents: read

concurrency:
  group: supabase-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    # Standard runners are free for public repositories. Do not incur private-repo usage.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install application dependencies
        run: npm ci
      - name: Prepare disposable local configuration
        run: |
          task_ci_dir="$RUNNER_TEMP/pulsotech-isolated"
          mkdir -p "$task_ci_dir/supabase"
          cp tests/integration/supabase/config.toml "$task_ci_dir/supabase/config.toml"
          echo "PULSOTECH_CI_WORKDIR=$task_ci_dir" >> "$GITHUB_ENV"
      - name: Start isolated Auth, PostgREST and PostgreSQL
        # CLI startup output includes ephemeral keys; keep it out of public logs.
        run: |
          if ! npx --yes supabase@2.120.0 start --workdir "$PULSOTECH_CI_WORKDIR" --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/pulsotech-start.log" 2>&1; then
            echo "The isolated Supabase stack could not start. No hosted project was contacted."
            docker ps --format '{{.Names}}: {{.Status}}'
            exit 1
          fi
      - name: Verify real sessions, permissions and sales transactions
        run: npm exec --yes --package=supabase@2.120.0 -- node --experimental-strip-types tests/integration/supabase-operations.mjs
      - name: Remove disposable containers and data
        if: always()
        run: npx --yes supabase@2.120.0 stop --workdir "$PULSOTECH_CI_WORKDIR" --no-backup > /dev/null 2>&1
